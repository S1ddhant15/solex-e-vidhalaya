<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Page Not Found | Solex e-Vidhayalay</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #32363b;
      background:
        radial-gradient(
          circle at top right,
          rgba(245, 126, 32, 0.22),
          transparent 36%
        ),
        linear-gradient(
          135deg,
          #f5f5f5 0%,
          #e4e6e8 100%
        );
    }

    .error-card {
      width: min(560px, 100%);
      padding: 48px 36px;
      text-align: center;
      background: rgba(255, 255, 255, 0.96);
      border-top: 6px solid #f57e20;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(50, 54, 59, 0.18);
    }

    .logo {
      width: 170px;
      max-width: 70%;
      margin-bottom: 28px;
    }

    .error-code {
      margin-bottom: 8px;
      color: #f57e20;
      font-size: clamp(70px, 18vw, 130px);
      font-weight: 800;
      line-height: 1;
    }

    h1 {
      margin-bottom: 14px;
      color: #3f4449;
      font-size: clamp(25px, 5vw, 36px);
    }

    p {
      max-width: 430px;
      margin: 0 auto 30px;
      color: #6d7277;
      font-size: 16px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button {
      display: inline-block;
      min-width: 160px;
      padding: 14px 22px;
      border: 2px solid #f57e20;
      border-radius: 10px;
      color: white;
      background: #f57e20;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: 0.25s ease;
    }

    .button:hover {
      background: #dc6811;
      border-color: #dc6811;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(245, 126, 32, 0.25);
    }

    .button.secondary {
      color: #555b60;
      background: transparent;
      border-color: #b9bdc1;
    }

    .button.secondary:hover {
      color: #f57e20;
      background: #fff7f0;
      border-color: #f57e20;
    }

    .footer-text {
      margin-top: 32px;
      margin-bottom: 0;
      color: #999da1;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .error-card {
        padding: 38px 20px;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="error-card">

    <img
      class="logo"
      src="assets/solex-logo.png"
      alt="Solex Energies"
    >

    <div class="error-code">404</div>

    <h1>Page Not Found</h1>

    <p>
      The learning page you are looking for is unavailable,
      moved or does not exist. Please return to the
      e-Vidhayalay dashboard.
    </p>

    <div class="actions">

      <a class="button" href="index.html">
        Return to Dashboard
      </a>

      <a class="button secondary" href="login.html">
        Go to Login
      </a>

    </div>

    <p class="footer-text">
      Solex e-Vidhayalay • Learning & Development Portal
    </p>

  </main>

</body>
</html>
