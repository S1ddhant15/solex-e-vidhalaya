<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>e-Vidhayalay Admin | Solex Energies</title>

  <link rel="stylesheet" href="portal.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="learning.css">
</head>

<body class="admin-page">

  <!-- Sidebar -->
  <aside class="admin-side">

    <img
      src="assets/solex-logo.png"
      alt="Solex Energies Logo"
    >

    <h2>Admin Console</h2>

    <button class="active">
      ▦ Course Management
    </button>

    <button>
      ♟ Learner Records
    </button>

    <button>
      ✓ Assessments
    </button>

    <button>
      ◇ Certificates
    </button>

    <button onclick="location.href='index.html'">
      ← Portal Dashboard
    </button>

  </aside>

  <!-- Main Content -->
  <main class="admin-main">

    <header>
      <div>
        <h1>Course Management</h1>
        <p>Create and manage Solex learning content</p>
      </div>

      <button id="addCourse">
        + Add Course
      </button>
    </header>

    <!-- Statistics -->
    <section class="admin-stats">

      <article>
        <b id="totalCourses">6</b>
        <span>Total Courses</span>
      </article>

      <article>
        <b>124</b>
        <span>Active Learners</span>
      </article>

      <article>
        <b>86%</b>
        <span>Compliance</span>
      </article>

      <article>
        <b>74</b>
        <span>Certificates</span>
      </article>

    </section>

    <!-- Course List -->
    <section class="admin-panel">

      <div class="admin-title">
        <h2>Published Courses</h2>

        <input
          id="adminSearch"
          type="search"
          placeholder="Search courses..."
          aria-label="Search courses"
        >
      </div>

      <div id="adminCourses">
        <!-- Courses will be inserted by admin.js -->
      </div>

    </section>

  </main>

  <!-- Add Course Dialog -->
  <dialog id="courseDialog">

    <form id="courseForm">

      <h2>Add New Course</h2>

      <label for="newTitle">
        Course title

        <input
          id="newTitle"
          type="text"
          placeholder="Example: TOPCon Cell Manufacturing"
          required
        >
      </label>

      <label for="newDepartment">
        Department

        <select id="newDepartment">
          <option value="Production">Production</option>
          <option value="Quality">Quality</option>
          <option value="Maintenance">Maintenance</option>
          <option value="Safety">Safety</option>
          <option value="Digital">Digital</option>
        </select>
      </label>

      <label for="newLessons">
        Number of lessons

        <input
          id="newLessons"
          type="number"
          min="1"
          max="50"
          value="5"
          required
        >
      </label>

      <div>
        <button type="button" id="cancelDialog">
          Cancel
        </button>

        <button type="submit">
          Save Course
        </button>
      </div>

    </form>

  </dialog>

  <script src="admin.js"></script>

</body>
</html>
