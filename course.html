<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TOPCon Manufacturing Course</title>

    <link rel="stylesheet" href="portal.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="learning.css">
</head>

<body class="learning-page">

<!-- LESSON SIDEBAR -->

<aside class="lesson-sidebar">

    <div class="course-brand">

        <img
            src="assets/solex-logo.png"
            alt="Solex Energies"
        >

        <button onclick="location.href='index.html'">
            ← Dashboard
        </button>

    </div>

    <div class="course-summary">

        <small>
            PRODUCTION • INTERMEDIATE
        </small>

        <h2 id="courseName">
            TOPCon Module Manufacturing
        </h2>

        <div class="course-progress">
            <i id="courseProgressBar"></i>
        </div>

        <p>
            <span id="completedCount">0</span>
            /6 lessons completed
        </p>

    </div>

    <!-- LESSONS GENERATED BY course.js -->

    <div
        id="lessonList"
        class="lesson-list"
    ></div>

    <button
        class="quiz-link"
        id="quizLink"
    >
        ✓ Final Assessment
    </button>

</aside>


<!-- MAIN COURSE AREA -->

<main class="lesson-main">

    <header class="lesson-header">

        <div>

            <small id="breadcrumb">
                COURSE / LESSON 1
            </small>

            <h1 id="lessonTitle">
                Introduction to TOPCon Technology
            </h1>

        </div>

        <!-- LANGUAGE -->

        <select id="languageSelect">

            <option value="en">
                English
            </option>

            <option value="hi">
                हिन्दी
            </option>

            <option value="gu">
                ગુજરાતી
            </option>

        </select>

    </header>


    <!-- LESSON VIEW -->

    <section
        id="lessonView"
        class="lesson-view"
    >

        <div
            class="lesson-hero"
            id="lessonHero"
        >

            <span id="lessonIcon">
                ☀
            </span>

            <button
                id="playButton"
                title="Play lesson"
            >
                ▶
            </button>

            <small>
                Interactive learning module
            </small>

        </div>


        <!-- LESSON CONTENT -->

        <article
            class="lesson-content"
            id="lessonContent"
        ></article>


        <!-- LESSON CONTROLS -->

        <footer>

            <button id="prevLesson">
                ← Previous
            </button>

            <button id="completeLesson">
                Mark Complete ✓
            </button>

            <button id="nextLesson">
                Next Lesson →
            </button>

        </footer>

    </section>


    <!-- QUIZ VIEW -->

    <section
        id="quizView"
        class="quiz-view hidden"
    >

        <div class="quiz-head">

            <small>
                FINAL ASSESSMENT
            </small>

            <h2>
                TOPCon Module Manufacturing
            </h2>

            <p>
                Score at least 70% to complete the course
                and unlock your certificate.
            </p>

        </div>

        <!-- QUESTIONS GENERATED BY course.js -->

        <form id="quizForm"></form>

        <button id="submitQuiz">
            Submit Assessment
        </button>

        <div id="quizResult"></div>

    </section>

</main>


<!-- COURSE SCRIPT -->

<script src="course.js"></script>

</body>

</html>
