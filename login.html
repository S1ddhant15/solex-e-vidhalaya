<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solex e‑Vidhayalay Login</title><link rel="stylesheet" href="portal.css"></head><body class="login-page"><form class="login-card" id="loginForm"><div class="solex-logo big"><span>☀</span>SOLEX<small>OWN YOUR POWER...</small></div><h1>Solex e‑Vidhayalay</h1><p>Learning & Development Portal</p><label>Employee ID<input id="userId" placeholder="Enter employee ID" required></label><label>Password<input type="password" placeholder="Enter password" required></label><label>Department<select id="loginDepartment" required><option value="">Select Department</option><option>Production</option><option>Quality</option><option>Maintenance</option><option>Process</option><option>PPC</option><option>Operations Excellence</option><option>Management</option></select></label><button type="submit">LOGIN</button><small>Secured Solex internal access</small></form><script>document.querySelector('#loginForm').onsubmit=e=>{e.preventDefault();localStorage.setItem('evidhayalayUser',document.querySelector('#userId').value);localStorage.setItem('evidhayalayDepartment',document.querySelector('#loginDepartment').value);location.href='index.html'};</script></body></html>
